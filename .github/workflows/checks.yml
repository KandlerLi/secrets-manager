name: Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  terraform:
    uses: KandlerLi/gha-common/.github/workflows/terraform-checks.yml@v0.0.14
    with:
      aws_region: eu-central-1
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      # The reusable workflow's build-image job pushes to GHCR.
      packages: write
      # plan's own "Post plan to pull request" comment step needs this.
      pull-requests: write
