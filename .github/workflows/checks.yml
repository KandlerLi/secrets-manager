name: Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  terraform:
    uses: KandlerLi/gha-common/.github/workflows/terraform-checks.yml@v0.0.13
    with:
      aws_region: eu-central-1
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      # A caller's job-level permissions cap every nested job inside the
      # reusable workflow -- must cover the union of what any of them
      # ask for, not just one. build-image needs write (pushes to
      # GHCR); packages: read fails with "requesting 'packages: write',
      # but is only allowed 'packages: read'" otherwise (found live
      # against aws-budget, 2026-09-03).
      packages: write
