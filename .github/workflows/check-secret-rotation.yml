name: Check secret rotation

# BACKLOG.md's "Manually-rotated Secrets Manager secrets have no
# rotation reminder": reads rotation-schedule.json daily and emails a
# warning once a secret is within 7 days of its recorded rotation
# deadline. No container/Terraform here at all -- this workflow never
# touches this repo's own Terraform state, only sends an email, so it
# runs directly on the runner and installs exactly what it needs
# (jq/awscli), the same "install only what this one workflow needs"
# precedent infra/k3s-apps' own rotate-blocky-postgres.yml already
# uses for psql.

on:
  schedule:
    # 07:00 UTC daily -- arbitrary, not aligned to any other scheduled
    # job in this workspace.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  check:
    name: Check rotation schedule
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 10
    environment: production
    env:
      AWS_REGION: eu-central-1

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install jq and awscli
        run: |
          apt-get update
          apt-get install -y --no-install-recommends jq awscli

      - name: Verify deployment configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "::error::Missing repository variable AWS_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::Missing repository variable AWS_ROLE_ARN"
            exit 1
          fi

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          action-timeout-s: "90"

      - name: Check rotation-schedule.json and email if anything's due
        run: ./scripts/check-secret-rotation.sh
